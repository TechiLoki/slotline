name: Verify Slotline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180 db api
      - name: Java unit and PostgreSQL integration tests
        run: docker compose --profile test run --build --rm tests
      - name: HTTP booking lifecycle
        run: node scripts/smoke.mjs
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
