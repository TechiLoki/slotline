name: slotline
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slotline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-db-password}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:-local-app-password}
    volumes:
      - data:/var/lib/postgresql/data
      - ./src/main/resources/db/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./src/main/resources/db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d slotline']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/slotline?connectTimeout=3&socketTimeout=10
      DATABASE_USER: slotline_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-app-password}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-slotline-local-admin}
      MANAGEMENT_SECRET: ${MANAGEMENT_SECRET:-slotline-local-management-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:${PORT:-8092}:8080"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/slotline?connectTimeout=3&socketTimeout=10
      DATABASE_USER: slotline_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-app-password}
      TEST_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-local-db-password}
    depends_on:
      db:
        condition: service_healthy
volumes:
  data:
